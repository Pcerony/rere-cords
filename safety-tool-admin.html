<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>预约管理 | RERE-CORDS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css?v=29">
    <link rel="stylesheet" href="safety-tool-admin.css?v=1">
</head>
<body class="reservation-admin-page">
    <header class="admin-header">
        <a class="admin-brand" href="index.html">RERE-CORDS</a>
        <span>内部管理</span>
    </header>

    <main class="admin-main">
        <header class="admin-page-heading">
            <span class="admin-kicker">MEDIA STUDIO / EQUIPMENT</span>
            <h1>安全道具预约管理</h1>
            <p>请先实地放置道具并发送邮件，再将预约标记为「已放置并通知」。</p>
        </header>

        <section id="admin-login-section" class="admin-login" aria-labelledby="admin-login-title">
            <h2 id="admin-login-title">管理员登录</h2>
            <form id="admin-login-form">
                <label for="admin-email">邮箱</label>
                <input id="admin-email" name="email" type="email" autocomplete="username" required>
                <label for="admin-password">密码</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                <p id="admin-login-message" class="admin-message" role="status" aria-live="polite"></p>
                <button id="admin-login-submit" class="admin-button" type="submit">登录</button>
            </form>
        </section>

        <section id="admin-dashboard" class="admin-dashboard" aria-labelledby="reservation-heading" hidden>
            <div class="admin-toolbar">
                <h2 id="reservation-heading">预约记录</h2>
                <label class="admin-filter" for="reservation-filter">
                    <span>状态</span>
                    <select id="reservation-filter">
                        <option value="all">全部状态</option>
                        <option value="pending">待处理</option>
                        <option value="ready">已放置并通知</option>
                        <option value="cancelled">已取消</option>
                        <option value="returned">已归还</option>
                    </select>
                </label>
                <button id="admin-refresh" class="admin-button admin-button-secondary" type="button" aria-label="刷新预约">刷新</button>
                <button id="admin-sign-out" class="admin-button admin-button-secondary" type="button">退出登录</button>
            </div>
            <p id="admin-dashboard-message" class="admin-message" role="status" aria-live="polite"></p>
            <div id="reservation-list" class="admin-reservation-list" aria-live="polite"></div>
        </section>
        <a class="admin-back" href="index.html#safety">返回网站</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
    <script src="safety-tool-reservation-config.js?v=1" defer></script>
    <script type="module" src="safety-tool-admin.js?v=1"></script>
</body>
</html>
