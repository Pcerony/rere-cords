<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>安全道具预约管理 | RERE-CORDS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css?v=30">
    <link rel="stylesheet" href="safety-tool-admin.css?v=2">
</head>
<body class="reservation-admin-page">
    <header class="admin-header">
        <a class="admin-brand" href="index.html">RERE-CORDS</a>
        <div class="admin-header-tools">
            <span data-admin-copy="internal">内部管理</span>
            <label class="admin-language" for="admin-language"><span data-admin-copy="language">语言</span>
                <select id="admin-language">
                    <option value="zh">简体中文</option>
                    <option value="en">English</option>
                </select>
            </label>
        </div>
    </header>

    <main class="admin-main">
        <header class="admin-page-heading">
            <span class="admin-kicker">MEDIA STUDIO / EQUIPMENT</span>
            <h1 data-admin-copy="page_title">安全道具预约管理</h1>
            <p data-admin-copy="page_intro">先实地放置道具；检查电脑默认邮件应用的发件账户，再打开日英草稿并手动发送。完成后回到这里确认「已放置并已通知」。</p>
        </header>

        <section id="admin-login-section" class="admin-login" aria-labelledby="admin-login-title">
            <h2 id="admin-login-title" data-admin-copy="login_heading">管理员登录</h2>
            <form id="admin-login-form">
                <label for="admin-email" data-admin-copy="email">邮箱</label>
                <input id="admin-email" name="email" type="email" autocomplete="username" required>
                <label for="admin-password" data-admin-copy="password">密码</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                <p id="admin-login-message" class="admin-message" role="status" aria-live="polite"></p>
                <button id="admin-login-submit" class="admin-button" type="submit" data-admin-copy="login">登录</button>
            </form>
        </section>

        <section id="admin-dashboard" class="admin-dashboard" aria-labelledby="reservation-heading" hidden>
            <div class="admin-toolbar">
                <h2 id="reservation-heading" data-admin-copy="reservations">预约记录</h2>
                <label class="admin-filter" for="reservation-filter">
                    <span data-admin-copy="status">状态</span>
                    <select id="reservation-filter">
                        <option value="all" data-admin-copy="all_statuses">全部状态</option>
                        <option value="pending" data-admin-copy="status_pending">待处理</option>
                        <option value="ready" data-admin-copy="status_ready">已放置并已通知</option>
                        <option value="cancelled" data-admin-copy="status_cancelled">已取消</option>
                        <option value="returned" data-admin-copy="status_returned">已归还</option>
                    </select>
                </label>
                <button id="admin-refresh" class="admin-button admin-button-secondary" type="button" aria-label="刷新预约" data-admin-copy="refresh">刷新</button>
                <button id="admin-sign-out" class="admin-button admin-button-secondary" type="button" data-admin-copy="sign_out">退出登录</button>
            </div>
            <p id="admin-dashboard-message" class="admin-message" role="status" aria-live="polite"></p>
            <div id="reservation-list" class="admin-reservation-list" aria-live="polite"></div>
        </section>
        <a class="admin-back" href="index.html#safety" data-admin-copy="back">返回网站</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" defer></script>
    <script src="safety-tool-reservation-config.js?v=1" defer></script>
    <script type="module" src="safety-tool-admin.js?v=3"></script>
</body>
</html>
