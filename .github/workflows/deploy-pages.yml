name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      REGISTRATION_ENABLED: ${{ vars.REGISTRATION_ENABLED }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Validate public Supabase key
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.SUPABASE_PUBLISHABLE_KEY || '';
          if (!key) {
            console.log('No Supabase key configured; reservation pages will remain closed.');
          } else {
            let isPublicKey = /^sb_publishable_[A-Za-z0-9_-]+$/.test(key);
            if (!isPublicKey) {
              try {
                const parts = key.split('.');
                const payload = parts.length === 3 ? JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8')) : {};
                isPublicKey = payload.role === 'anon';
              } catch {
                isPublicKey = false;
              }
            }
            if (!isPublicKey) {
              console.error('SUPABASE_PUBLISHABLE_KEY must be an sb_publishable key or a legacy anon JWT.');
              process.exit(1);
            }
          }
          NODE

      - name: Run site tests
        run: npm test

      - name: Prepare Pages files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='.supabase/' \
            --exclude='node_modules/' \
            --exclude='prototype-data/' \
            --exclude='prototype-server/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='supabase/' \
            --exclude='docs/' \
            --exclude='output/' \
            --exclude='.playwright-cli/' \
            --exclude='.superpowers/' \
            --exclude='_site/' \
            --exclude='submission-admin.html' \
            --exclude='submission-admin.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='.DS_Store' \
            ./ _site/
          config="$(jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" '{supabaseUrl: $url, publishableKey: $key}')"
          printf 'window.RERE_CORDS_RESERVATION_CONFIG = %s;\n' "$config" > _site/safety-tool-reservation-config.js
          registration_config="$(jq -n --arg enabled "$REGISTRATION_ENABLED" --arg siteKey "$TURNSTILE_SITE_KEY" '{enabled: ($enabled == "true" and ($siteKey | length) > 0), turnstileSiteKey: $siteKey}')"
          printf 'window.RERE_CORDS_REGISTRATION_CONFIG = %s;\n' "$registration_config" > _site/event-registration-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
